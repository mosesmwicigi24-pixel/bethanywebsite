name: Build & Deploy

# Merge a PR to main -> build the image, push to GHCR, roll it out on the VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (legacy app / POS)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push image (storefront)
        uses: docker/build-push-action@v6
        with:
          context: storefront
          push: true
          build-args: |
            NEXT_PUBLIC_HUB_API=https://hub.bethanyhouse.co.ke/api/v1
          tags: |
            ${{ env.IMAGE }}-storefront:latest
            ${{ env.IMAGE }}-storefront:${{ github.sha }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE_SHA
          script: |
            set -e
            cd /opt/bethanywebsite
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_SHA: ${{ github.sha }}

      # Tell Bing (and every IndexNow participant) which pages changed, straight
      # after the roll-out. Bing's index feeds Copilot and is the most likely
      # source for ChatGPT search; Google ignores IndexNow and uses the sitemap.
      # The key is deliberately public — it only proves the host made the call.
      - name: Ping IndexNow with the live sitemap
        if: success()
        run: |
          sleep 120
          python3 - <<'PY'
          import json, re, urllib.request
          sm = urllib.request.urlopen("https://bethanyhouse.co.ke/sitemap.xml", timeout=60).read().decode()
          urls = re.findall(r"<loc>([^<]+)</loc>", sm)[:10000]
          body = json.dumps({
              "host": "bethanyhouse.co.ke",
              "key": "c2be1d03679d41cfb2d29b91b636e63e",
              "keyLocation": "https://bethanyhouse.co.ke/c2be1d03679d41cfb2d29b91b636e63e.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              r = urllib.request.urlopen(req, timeout=60)
              print("IndexNow:", r.status, "for", len(urls), "URLs")
          except urllib.error.HTTPError as e:
              print("IndexNow HTTP", e.code, e.read()[:200])
          PY
